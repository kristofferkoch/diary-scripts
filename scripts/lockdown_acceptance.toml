schema_version = 1
suite_id = "act01-lockdown-acceptance"

[[cases]]
id = "preflight.dark_safe"
title = "Confirm owner authorization, dark enforcement, maintenance window, and no conflicting work"
operation = "preflight.dark_safe"
coverage = ["act.dark_safe"]
dependencies = ["ACT-01"]
required_evidence = ["deployment_dark", "owner_authorization", "maintenance_window", "conflicting_work_absent"]
timeout_seconds = 60

[[cases]]
id = "preflight.deployed_identity"
title = "Bind the run to exact approved deployed commits and all dependency health"
operation = "preflight.deployed_identity"
coverage = ["act.exact_deployed"]
dependencies = ["CTL-02", "CTL-03", "CTL-04", "CTL-05", "CTL-07", "CTL-09", "PIPE-05"]
required_evidence = ["approved_commit_ids", "deployed_commit_ids", "dependency_health", "adapter_capabilities"]
timeout_seconds = 60

[[cases]]
id = "preflight.recovery"
title = "Prove local recovery, fresh owner authentication, evidence storage, and notification consent"
operation = "preflight.recovery"
coverage = ["act.dark_safe"]
dependencies = ["CTL-01", "CTL-06", "CTL-08", "CTL-09"]
required_evidence = ["recovery_verified", "fresh_auth_available", "dashboard_read_only_health", "evidence_storage_verified", "signal_probe_consent"]
timeout_seconds = 60

[[cases]]
id = "activation.integrated"
title = "Activate the exact integrated result and verify initial locked enforcement"
operation = "activation.integrated"
coverage = ["act.integrated"]
dependencies = ["CTL-02", "CTL-03", "CTL-04", "CTL-05", "CTL-07", "PIPE-05"]
required_evidence = ["activated_commit_ids", "locked_verified", "controller_audit_refs", "pipeline_audit_refs"]
timeout_seconds = 180


[project]
name = "openclaw-workspace-scripts"
version = "0.1.0"
description = "Helper scripts: mail embedding pipeline (pgvector + Ollama bge-m3), notmuch tag sync, inbox auto-archive."
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2",
    "mail-parser-reply>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--doctest-modules"

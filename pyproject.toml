[project]
name = "diary-scripts"
version = "0.1.0"
description = "Helper scripts: mail embedding pipeline (pgvector + Ollama bge-m3), notmuch tag sync, inbox auto-archive."
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2",
    "mail-parser-reply>=1.0",
    # mail_reader webapp
    "fastapi>=0.115",
    "python-multipart>=0.0.9",  # multipart/form-data for the /notes/ photo upload
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "nh3>=0.2",
    "markdown>=3.6",
    # spond_sync (Olen/Spond, unofficial)
    "spond>=1.2",
    # pr_compose — HTTP client to the local MLX server on gpu-host:8080
    "httpx>=0.27",
    # kindle_dashboard — wall display PNG generator on server
    "pillow>=11",
    "playwright>=1.49",
    "astral>=3.2",
]

# Console entry points — run as `uv run <name>` (no more `uv run scripts/foo.py`),
# which also puts the package on sys.path so no module needs a __file__ shim.
[project.scripts]
mailshow          = "scripts.mailshow:main"
search-mail       = "scripts.search_mail:main"
embed-mail        = "scripts.embed_mail:main"
archive-inbox     = "scripts.archive_inbox:main"
notmuch-sync-tags = "scripts.notmuch_sync_tags:main"
spond-sync        = "scripts.spond_sync:main"
spondshow         = "scripts.spondshow:main"
signal-capture    = "scripts.signal_capture:main"
signalshow        = "scripts.signalshow:main"
finance-ingest    = "scripts.finance_ingest:main"
retire-calendar   = "scripts.retire_calendar:main"
notes             = "scripts.notes:main"
shopping          = "scripts.shopping:main"
kindle-dashboard  = "scripts.kindle_dashboard.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "mail_reader"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ty>=0.0.38",   # Astral's modern type checker (alpha but works)
]

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--doctest-modules"

[tool.ty.src]
include = ["scripts", "mail_reader"]

[tool.ty.rules]
# Tests intentionally probe with weird inputs; relax a couple of the noisiest
# checks rather than littering tests with `# type: ignore`.
unresolved-import = "warn"
possibly-missing-attribute = "warn"

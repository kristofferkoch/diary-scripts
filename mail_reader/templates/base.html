<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}mail{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
<script src="{{ url_for('static', path='/htmx.min.js') }}" defer></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a href="{{ url_for('get_inbox') }}" class="logo" aria-label="Innboks">
      <span class="mark" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4.5 A1.5 1.5 0 0 1 3.5 3 H12.5 A1.5 1.5 0 0 1 14 4.5 V11.5 A1.5 1.5 0 0 1 12.5 13 H3.5 A1.5 1.5 0 0 1 2 11.5 Z"/>
          <path d="M2.5 4.5 L8 9 L13.5 4.5"/>
        </svg>
      </span>
      <span>Post</span>
    </a>
    <a href="{{ url_for('get_calendar') }}" class="navlink" aria-label="Kalender">
      <span class="mark" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3.5" width="12" height="10.5" rx="1.5"/>
          <path d="M2 6.5 H14"/>
          <path d="M5 2 V5"/>
          <path d="M11 2 V5"/>
        </svg>
      </span>
      <span>Kalender</span>
    </a>
    <a href="{{ url_for('get_notes') }}" class="navlink" aria-label="Notater">
      <span class="mark" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 2.5 H12 A1 1 0 0 1 13 3.5 V13.5 A1 1 0 0 1 12 14.5 H4 A1 1 0 0 1 3 13.5 V3.5 A1 1 0 0 1 4 2.5 Z"/>
          <path d="M5.5 6 H10.5"/>
          <path d="M5.5 8.5 H10.5"/>
          <path d="M5.5 11 H8.5"/>
        </svg>
      </span>
      <span>Notater</span>
    </a>
    <a href="{{ url_for('get_shopping') }}" class="navlink" aria-label="Handleliste">
      <span class="mark" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 2.5 H3.6 L5 10.5 H12.4 L13.6 4.5 H4.2"/>
          <circle cx="6" cy="13" r="0.9"/>
          <circle cx="11.5" cy="13" r="0.9"/>
        </svg>
      </span>
      <span>Handle</span>
    </a>
    <span class="queue-slot"
          hx-get="{{ url_for('get_queue_indicator') }}"
          hx-trigger="load, every 5s"
          hx-swap="innerHTML"></span>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>

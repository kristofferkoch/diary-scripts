<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}mail{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
<script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a href="{{ url_for('get_inbox') }}" class="logo" aria-label="Innboks">
      <span class="mark" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4.5 A1.5 1.5 0 0 1 3.5 3 H12.5 A1.5 1.5 0 0 1 14 4.5 V11.5 A1.5 1.5 0 0 1 12.5 13 H3.5 A1.5 1.5 0 0 1 2 11.5 Z"/>
          <path d="M2.5 4.5 L8 9 L13.5 4.5"/>
        </svg>
      </span>
      <span>Post</span>
    </a>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
